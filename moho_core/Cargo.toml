[package]
name = "moho_core"
version = "0.1.0"
authors = ["Justin Moore <jmoore5268@gmail.com>"]
edition = "2018"

[dependencies]
glam = { workspace = true }
# Use a `winit` version compatible with the chosen GPU backend's window-handle expectations.
winit = { workspace = true, default-features = true }
rand = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
legion = "0.4"
log = { workspace = true }
noise = "0.9"
serde = { workspace = true, features = ["derive"] }
