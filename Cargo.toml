[[bin]]
path = "src/main.rs"
name = "moho"
required-features = []

[package]
name = "moho"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["moho_core", "moho_game", "moho_render_api", "moho_renderer", "moho_audio", "moho_ui", "moho_input", "moho_sim", "moho_types", "moho_physics"]

[workspace.dependencies]
bincode = "2.0"
bytemuck = "1.24"
crc32fast = "1.5"
crossbeam-channel = "0.5"
env_logger = "0.11"
glam = "0.30.8"
legion = "0.4.0"
log = "0.4"
naga = "27"
noise = "0.9"
pollster = "0.4"
rand = "0.10"
rodio = "0.22"
serde = "1.0"
thiserror = "2.0"
wgpu = "27"
winit = "0.30"
moho_physics = { path = "moho_physics" }
rapier3d = { version = "0.32", features = ["simd-stable"] }

[dependencies]
crossbeam-channel = { workspace = true }
legion = { workspace = true }

[dependencies.bincode]
workspace = true

[dependencies.bytemuck]
workspace = true
features = ["derive"]

[dependencies.env_logger]
workspace = true

[dependencies.glam]
workspace = true

[dependencies.log]
workspace = true

[dependencies.moho_audio]
path = "moho_audio"

[dependencies.moho_core]
path = "moho_core"

[dependencies.moho_game]
path = "moho_game"

[dependencies.moho_input]
path = "moho_input"

[dependencies.moho_renderer]
path = "moho_renderer"

[dependencies.moho_sim]
path = "moho_sim"

[dependencies.moho_types]
path = "moho_types"

[dependencies.moho_physics]
workspace = true

[dependencies.moho_ui]
path = "moho_ui"

[dependencies.pollster]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.wgpu]
workspace = true

[dependencies.winit]
workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "event_bus_bench"
harness = false

