[[bin]]
path = "src/main.rs"
name = "moho"
required-features = []

[package]
name = "moho"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["moho_core", "moho_game", "moho_render_api", "moho_renderer", "moho_audio", "moho_ui", "moho_input", "moho_types", "moho_physics"]

[workspace.dependencies]
bincode = "2.0"
bytemuck = "1.24"
crossbeam-channel = "0.5"
glam = "0.30.8"
naga = "29.0.1"
noise = "0.9"
proptest = { version = "1.11", default-features = false, features = ["std"] }
rand = "0.10"
rodio = "0.22"
serde = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wgpu = "29.0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
moho_physics = { path = "moho_physics" }
rapier3d = { version = "0.32", features = ["simd-stable"] }
tempfile = "3.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"

# Won't fix: noise for game and rendering code.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"

# Ratchet: existing violations. Fix, then delete the line; never add to this group.
float_cmp = "allow"
large_stack_arrays = "allow"
manual_midpoint = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"

[dependencies]
crossbeam-channel = { workspace = true }

[dependencies.bincode]
workspace = true

[dependencies.glam]
workspace = true

[dependencies.moho_audio]
path = "moho_audio"

[dependencies.moho_core]
path = "moho_core"

[dependencies.moho_game]
path = "moho_game"

[dependencies.moho_input]
path = "moho_input"

[dependencies.moho_renderer]
path = "moho_renderer"

[dependencies.moho_types]
path = "moho_types"

[dependencies.moho_physics]
workspace = true

[dependencies.moho_ui]
path = "moho_ui"

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.wgpu]
workspace = true

[dependencies.winit]
workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = { workspace = true }

[[bench]]
name = "event_bus_bench"
harness = false

[lints]
workspace = true
