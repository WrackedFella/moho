[workspace]
resolver = "3"
members = ["flagstone", "moho_app", "moho_core", "flagstone_game", "flagstone_voxel", "moho_render_api", "moho_renderer", "moho_audio", "flagstone_ui", "moho_input", "moho_physics", "moho_level", "moho_fps_rules"]

[workspace.dependencies]
bytemuck = "1.24"
gilrs = "0.11"
glam = "0.33"
naga = "30.0.1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
crc32fast = "1"
proptest = { version = "1.11", default-features = false, features = ["std"] }
rand = "0.10"
rodio = "0.22"
serde = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wgpu = "30.0.1"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
moho_physics = { path = "moho_physics" }
moho_fps_rules = { path = "moho_fps_rules" }
rapier3d = "0.36"
tempfile = "3.5"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"

# Won't fix: noise for game and rendering code.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"

# Ratchet: existing violations. Fix, then delete the line; never add to this group.
float_cmp = "allow"
large_stack_arrays = "allow"
manual_midpoint = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
