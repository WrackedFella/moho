# Supply-chain gate (`just deny`). Schema: cargo-deny 0.20.

[graph]
all-features = true

[advisories]
# Unmaintained-crate notices only (no known vulnerabilities). Remove each entry
# when the dependency that pulls it in is replaced or upgraded.
ignore = []

[licenses]
# Permissive licenses plus MPL-2.0 (symphonia audio codecs via rodio). GPL and
# LGPL appear only as alternatives in dual-licensed crates and aren't allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# The wgpu/winit/windows-sys stack pins several duplicate versions upstream.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
