[package]
name = "moho_ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wgpu = { workspace = true }
moho_renderer = { path = "../moho_renderer" }
moho_render_api = { path = "../moho_render_api" }
winit = { workspace = true }
egui = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui-wgpu = "0.34.3"
tracing = { workspace = true }
moho_input = { path = "../moho_input" }
moho_core = { path = "../moho_core" }
moho_game = { path = "../moho_game" }
rand = { workspace = true }

[features]
default = []
# Test-only helpers for the egui adapter. Enable when running integration
# tests that require internal adapter control (for example to simulate
# press/release without an actual window). This is intentionally optional
# so library consumers won't accidentally depend on test utilities.
ui-egui-test = []

[lints]
workspace = true
