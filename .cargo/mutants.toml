test_tool = "nextest"
# GPU, windowing and egui-adapter code has no headless tests, so every mutant
# there would read as missed without telling us anything.
exclude_globs = [
    "moho_renderer/**",
    "moho_ui/src/adapter/**",
    "src/main.rs",
    "src/app/renderer_setup.rs",
]
# These bodies only drive the renderer backend or window, which need a real
# `Window`; the binary's headless tests (`App::headless`) can't reach them.
exclude_re = [
    "WindowEventHandler::handle_redraw_requested",
    "WindowManager::initial_render",
    'delete match arm "light" in EventProcessor::handle_debug_event',
]
