name: PR review

# Reviews an open PR with devflow:pr-review and hardens it before a human looks: when
# the verdict is `changes`, devflow:respond fixes the findings and the workflow
# re-dispatches itself for another review. At most two fix rounds, then a third review
# with no fixes. The review is posted as a comment (`PR approval` is unset); a human
# approves and merges. A PR opened ready, or turned ready, starts round 1. Each review waits
# for CI on the PR head to finish, and a head that already has a review is skipped. Pushes
# and PRs made with the default token start no workflow, so the orchestrate job in
# claude.yml dispatches round 1 itself and this workflow dispatches each later round.
on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      round:
        description: Review round (1 to 3)
        default: "1"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    name: Review and fix
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      ROUND: ${{ inputs.round || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A PR that is closed, merged or has lost its head branch has nothing to review.
      - name: Resolve the PR
        id: pr
        run: |
          read -r state repo ref head_sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '[.state, (.head.repo.full_name // ""), .head.ref, .head.sha] | @tsv')
          reviewed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.commit_id == \"$head_sha\" and (.body | startswith(\"Verdict:\")))] | length" | awk '{ n += $1 } END { print n + 0 }')
          reason=""
          if [ "$state" != "open" ]; then
            reason="PR #$PR is $state."
          elif [ -z "$repo" ] || ! gh api "repos/$repo/branches/$ref" --silent 2>/dev/null; then
            reason="The head branch \`$ref\` of PR #$PR no longer exists."
          elif [ "$reviewed" -gt 0 ]; then
            reason="PR #$PR head $head_sha already has a review."
          fi
          if [ -n "$reason" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the PR head
        if: steps.pr.outputs.skip != 'true'
        run: |
          gh pr checkout "$PR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # The review reads CI as evidence, and a pending CI ends it without a verdict, so wait
      # for the CI run on this head before starting Claude. A head with no CI run (a push by
      # the default token starts none) is reviewed after five minutes. Polling costs no tokens.
      - name: Wait for CI
        if: steps.pr.outputs.skip != 'true'
        run: |
          deadline=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$HEAD_SHA" \
              --limit 1 --json status --jq '.[0].status // "none"')
            if [ "$status" = "completed" ]; then
              echo "CI finished on $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$status" = "none" ] && [ "$SECONDS" -gt 300 ]; then
              echo "No CI run for $HEAD_SHA; reviewing without one." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::CI on $HEAD_SHA did not finish in 45 minutes."
          exit 1
      # Installs the pinned Rust toolchain and the gate's tools (just, nextest, ...).
      - name: Install toolchain
        if: steps.pr.outputs.skip != 'true'
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: steps.pr.outputs.skip != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
        with:
          shared-key: gate-ubuntu-latest
          save-if: false
      - name: Review
        id: review
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          # Re-dispatched runs are started by the default token, so the actor is
          # github-actions[bot]. Allow only that bot; the repo is public.
          allowed_bots: github-actions
          display_report: true
          prompt: /devflow:pr-review ${{ env.PR }}
          claude_args: |
            --max-turns 100
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Never push, merge or resolve a thread."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Task,Skill"
      # The action hides the run's output; a denied tool call otherwise ends the review
      # silently, so list the denials here.
      - name: Show permission denials
        if: always() && steps.review.outcome != 'skipped' && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '
            [(if type == "array" then .[] else . end) | select(.type == "result") | .permission_denials // []] | add // []
            | if length == 0 then "Review run: no permission denials."
              else "### Review run: \(length) permission denial(s)\n" +
                   (map("- `\(.tool_name)`: `\(.tool_input | tostring | .[0:300])`") | join("\n"))
              end' "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
      # The verdict is the first line of the review the skill posted for this head SHA.
      # No review for this head means the run never reached a verdict, so the job fails.
      - name: Read verdict
        id: verdict
        if: steps.pr.outputs.skip != 'true'
        run: |
          verdict=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.commit_id == \"$HEAD_SHA\" and (.body | startswith(\"Verdict:\")))] | last | .body // \"\"" \
            | head -n1 | sed -E 's/^Verdict: *([a-z]+).*/\1/')
          if [ -z "$verdict" ]; then
            echo "::error::No review with a verdict was posted for $HEAD_SHA. See the permission denials in the Step Summary."
            exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
      - name: Fix findings
        id: respond
        if: steps.verdict.outputs.verdict == 'changes' && env.ROUND != '3'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          # Re-dispatched runs are started by the default token, so the actor is
          # github-actions[bot]. Allow only that bot; the repo is public.
          allowed_bots: github-actions
          display_report: true
          prompt: /devflow:respond ${{ env.PR }}
          claude_args: |
            --max-turns 200
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Merge the base branch into the PR branch; never rebase or force-push. Address the findings in the latest review whose first line starts with 'Verdict:'."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Edit,Write,Task,Skill"
      - name: Review again
        if: steps.respond.outcome == 'success'
        run: |
          next=$((ROUND + 1))
          gh workflow run pr-review.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" -f pr="$PR" -f round="$next"
      - name: Hand over to a human
        if: steps.verdict.outputs.verdict == 'changes' && env.ROUND == '3'
        run: |
          gh pr comment "$PR" --body "Review round 3 still has findings. The fix loop stops here; a human decides.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
