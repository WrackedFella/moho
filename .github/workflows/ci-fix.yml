name: CI fix

# Fixes red CI on a PR that an agent run opened. A failed CI run on such a PR starts
# devflow:respond with the failing jobs as the task. At most two fix rounds per PR, counted
# by the comments this workflow posts; after that a human decides. Human PRs are ignored.
# Pushes by the default token start no CI run, so a fix pushed by the action's app token is
# what re-runs CI and continues the loop.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix CI
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      # Only PRs an agent opened, still open, on the SHA that failed.
      - name: Resolve the PR
        id: pr
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${pr:-0}" --jq '.user.login' 2>/dev/null || true)
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${pr:-0}" --jq '.head.sha' 2>/dev/null || true)
          reason=""
          if [ -z "$pr" ]; then reason="No open PR for $HEAD_SHA."
          elif [ "$current" != "$HEAD_SHA" ]; then reason="PR #$pr has moved past $HEAD_SHA."
          elif [ "$author" != "claude[bot]" ] && [ "$author" != "github-actions[bot]" ]; then
            reason="PR #$pr was not opened by an agent run."
          fi
          if [ -n "$reason" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rounds=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq '[.[] | select(.body | startswith("CI fix round"))] | length')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "round=$((rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$rounds" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$pr" --body "CI is still red after 2 fix rounds. The fix loop stops here; a human decides.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          else
            gh pr comment "$pr" --body "CI fix round $((rounds + 1)) of 2: run $RUN_ID failed on $HEAD_SHA.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          fi
      - name: Install toolchain
        if: steps.pr.outputs.skip != 'true'
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: steps.pr.outputs.skip != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
        with:
          shared-key: gate-ubuntu-latest
          save-if: false
      - name: Fix CI
        id: fix
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The triggering actor is whoever pushed the failed commit: the Claude app or
          # the default token. The repo is public, so no wildcard.
          allowed_bots: claude,github-actions
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          display_report: true
          prompt: /devflow:respond ${{ steps.pr.outputs.pr }}
          claude_args: |
            --max-turns 200
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. CI run ${{ env.RUN_ID }} failed on this PR. Read its failed jobs with 'gh run view ${{ env.RUN_ID }} --log-failed', reproduce the failure, fix the cause and push. Never skip, disable or quarantine a test, and never weaken a lint or the gate. Merge the base branch into the PR branch; never rebase or force-push."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh api:*),Edit,Write,Task,Skill"
