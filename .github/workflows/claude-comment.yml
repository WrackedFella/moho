name: Claude comment

# Answers an `@claude` comment on an issue or pull request, for example to resolve a
# merge conflict on a PR. Only repository owners, members and collaborators trigger it,
# so an outside commenter cannot spend the agent's budget or push to a branch.
# Issue runs from the `agent-ready` label live in claude.yml.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Respond
    if: >-
      contains(github.event.comment.body, '@claude')
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installs the pinned Rust toolchain and the gate's tools (just, nextest, ...).
      - name: Install toolchain
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Restore-only: the gate on dev writes this cache. The env matches the gate's so the
      # key does; it is set on this step alone to leave incremental builds on for the agent.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
        with:
          shared-key: gate-ubuntu-latest
          save-if: false
      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          display_report: true
          claude_args: |
            --max-turns 100
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Merge the base branch into a PR branch; never rebase or force-push."
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Edit,Write,Task,Skill"
