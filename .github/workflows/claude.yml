name: Claude

# Runs the devflow orchestrator on one issue. Labeling an issue `agent-ready` starts a
# run; a manual dispatch with an issue number does the same for testing. The default
# GitHub token is enough: board Status is moved by the Board sync workflow, not here.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to orchestrate
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  # A feature is a gate, not a work item: it has exit criteria but no tech spec, test map
  # or gate class, so the orchestrator has nothing to implement. Say so instead of running.
  skip-feature:
    name: Skip feature
    if: github.event.label.name == 'agent-ready' && contains(github.event.issue.labels.*.name, 'feature')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the skip
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body 'No run started. This issue is labeled `feature`, and `agent-ready` starts the orchestrator on one work item. Put `agent-ready` on a card under this feature instead.'

  orchestrate:
    name: Orchestrate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'agent-ready'
          && !contains(github.event.issue.labels.*.name, 'feature'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Installs the pinned Rust toolchain and the gate's tools (just, nextest, ...).
      - name: Install toolchain
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: anthropics/claude-code-action@v1
        env:
          # The run ends when the main agent stops, so a background subagent is killed
          # mid-task. Subagents must run in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action rejects a ref on plugin_marketplaces, so the plugin follows the
          # marketplace's default branch; .claude/settings.json holds the pinned ref.
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          display_report: true
          prompt: /devflow:orchestrate ${{ github.event.issue.number || inputs.issue }}
          claude_args: |
            --max-turns 200
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running."
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Edit,Write,Task,Skill"
