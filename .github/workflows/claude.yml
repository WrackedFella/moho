name: Claude

# Runs devflow on one issue. Labeling a work item `agent-ready` starts the orchestrator;
# labeling a `feature` issue starts refinement into work items. A manual dispatch with an
# issue number runs the orchestrator, for testing. A run that needs a person's answer
# comments its questions and labels the issue `agent-paused`; a reply from an owner, member
# or collaborator on a paused issue starts the same skill again. The default
# GitHub token is enough: board Status is moved by the Board sync workflow, not here.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to orchestrate
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  # A feature is refined into work items, not implemented. The refine skill publishes the
  # cards as sub-issues and escalates open questions as a comment. It labels a card
  # `agent-ready` only when the project's `Card review` is `not required`; labels set with
  # the default token start no workflow, so this job dispatches a run per new labeled card.
  refine:
    name: Refine feature
    if: >-
      contains(github.event.issue.labels.*.name, 'feature')
      && (github.event.label.name == 'agent-ready'
          || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
              && contains(github.event.issue.labels.*.name, 'agent-paused')
              && github.event.comment.user.type != 'Bot'
              && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pause label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create agent-paused --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Run waiting for a human answer; reply on the issue to resume" || true
      - name: Note existing cards
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$FEATURE/sub_issues" --paginate --jq '.[].number' > "$RUNNER_TEMP/cards-before"
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          display_report: true
          prompt: /devflow:refine ${{ github.event.issue.number }}
          claude_args: |
            --max-turns 100
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Never end your turn with a status message: after a skill or subagent returns, continue with the next step. Stop only after the final report, or after pausing with a comment and the agent-paused label."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Edit,Write,Task,Skill"
      # The action hides the run's output, so a denial shows only as a count. List what was
      # denied, so the allow-list can be tuned from evidence.
      - name: List denied commands
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          {
            echo "### Run result"
            jq -r '.[] | select(.type == "result") | "- subtype `\(.subtype)`, turns \(.num_turns)"' "$EXECUTION_FILE"
            echo "### Denied commands"
            jq -r '.[] | select(.type == "result") | .permission_denials[]? | "- `\(.tool_name)`: \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200])"' "$EXECUTION_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start runs for new labeled cards
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$FEATURE/sub_issues" --paginate \
            --jq '.[] | select(any(.labels[]; .name == "agent-ready")) | .number' |
          while read -r card; do
            grep -qx "$card" "$RUNNER_TEMP/cards-before" && continue
            gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.event.repository.default_branch }}" -f issue="$card"
          done

  orchestrate:
    name: Orchestrate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (!contains(github.event.issue.labels.*.name, 'feature')
          && (github.event.label.name == 'agent-ready'
              || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
                  && contains(github.event.issue.labels.*.name, 'agent-paused')
                  && github.event.comment.user.type != 'Bot'
                  && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pause label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create agent-paused --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Run waiting for a human answer; reply on the issue to resume" || true
      # Installs the pinned Rust toolchain and the gate's tools (just, nextest, ...).
      - name: Install toolchain
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Restore-only: the gate on dev writes this cache. The env matches the gate's so the
      # key does; it is set on this step alone to leave incremental builds on for the agent.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
        with:
          shared-key: gate-ubuntu-latest
          save-if: false
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          # The run ends when the main agent stops, so a background subagent is killed
          # mid-task. Subagents must run in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action rejects a ref on plugin_marketplaces, so the plugin follows the
          # marketplace's default branch; .claude/settings.json holds the pinned ref.
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          # Re-dispatched runs are started by the default token, so the actor is
          # github-actions[bot]. Allow only that bot; the repo is public.
          allowed_bots: github-actions
          display_report: true
          prompt: /devflow:orchestrate ${{ github.event.issue.number || inputs.issue }}
          claude_args: |
            --max-turns 200
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Never end your turn with a status message: after a skill or subagent returns, continue with the next step. Stop only after the final report, or after pausing with a comment and the agent-paused label."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh run list:*),Bash(gh run view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(rg:*),Bash(grep:*),Bash(jq:*),Bash(mkdir:*),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/board *),Edit,Write,Task,Skill"
      # The action hides the run's output, so a denial shows only as a count. List what was
      # denied, so the allow-list can be tuned from evidence.
      - name: List denied commands
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          {
            echo "### Run result"
            jq -r '.[] | select(.type == "result") | "- subtype `\(.subtype)`, turns \(.num_turns)"' "$EXECUTION_FILE"
            echo "### Denied commands"
            jq -r '.[] | select(.type == "result") | .permission_denials[]? | "- `\(.tool_name)`: \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200])"' "$EXECUTION_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
      # PRs opened with the default token start no workflow, so start the review loop here.
      - name: Start PR review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate \
            --jq ".[] | select((.body // \"\") | test(\"Closes #$ISSUE([^0-9]|$)\")) | .number")
          for pr in $prs; do
            [ "${{ vars.PR_REVIEW_ENABLED }}" = true ] || continue
            gh workflow run pr-review.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.event.repository.default_branch }}" -f pr="$pr" -f round=1
          done
          [ -n "$prs" ] && exit 0
          # No PR is fine only when the run paused for an answer.
          if gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' |
            grep -qx agent-paused; then
            exit 0
          fi
          msg="Orchestrate #$ISSUE ended with no open PR and no agent-paused label"
          echo "::error::$msg"
          echo "### Outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg. Resume with: gh workflow run claude.yml --ref dev -f issue=$ISSUE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
