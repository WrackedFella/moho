name: Claude

# Runs Claude Code on GitHub's runners with the devflow plugin installed.
# Triggers: an @claude comment, a manual dispatch with a prompt, or (smoke test)
# a change to this file on a PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Instructions for Claude
        required: true
  pull_request:
    paths: [.github/workflows/claude.yml]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    name: Claude
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          # scripts/board needs GraphQL and Projects v2, which the default token lacks.
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          prompt: ${{ github.event.inputs.prompt || (github.event_name == 'pull_request' && 'Smoke test, read-only: (1) list the devflow skills and agents you can see; (2) find the devflow plugin directory with find under ~/.claude/plugins and run its scripts/board next WrackedFella 1, reporting the output or the exact error; (3) report which of ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN authenticated you if you can tell. Change no files and post no comments.') || '' }}
          claude_args: >-
            --max-turns 12
            --allowedTools "Bash(find:*),Bash(ls:*),Bash(*scripts/board next *),Bash(gh auth status)"
