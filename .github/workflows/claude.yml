name: Claude

# Runs Claude Code on GitHub's runners with the devflow plugin installed.
# Triggers: an @claude comment, a manual dispatch with a prompt, or (smoke test)
# a change to this file on a PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Instructions for Claude
        required: true
  pull_request:
    paths: [.github/workflows/claude.yml]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    name: Claude
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Claude Code may only touch the workspace, so the board script comes from a
      # checkout here instead of the plugin cache. The ref matches the pin in
      # .claude/settings.json.
      - uses: actions/checkout@v4
        with:
          repository: WrackedFella/claude-skills
          ref: v0.7.0
          path: .devflow-src
      - uses: anthropics/claude-code-action@v1
        env:
          # scripts/board needs GraphQL and Projects v2, which the default token lacks.
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          # Writes the run to the job summary; the agent runs without GitHub comments on dispatch.
          display_report: true
          prompt: |
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prompt || '' }}
            ${{ github.event_name == 'pull_request' && 'Smoke test, read-only. 1) List the devflow skills and agents you can see. 2) Run exactly this single command: bash .devflow-src/plugins/devflow/scripts/board next WrackedFella 1. Report its output or the exact error. Do not combine commands. Change no files and post no comments.' || '' }}
          claude_args: |
            --max-turns 12
            --allowedTools "Bash(bash .devflow-src/plugins/devflow/scripts/board next *),Bash(ls:*),Bash(cat:*)"
