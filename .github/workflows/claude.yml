name: Claude

# Runs devflow on one issue. Labeling a work item `agent-ready` starts the orchestrator;
# labeling a `feature` issue starts refinement into work items. A manual dispatch with an
# issue number runs the orchestrator, for testing. A run that needs a person's answer
# comments its questions and labels the issue `agent-paused`; a comment starting with Resume
# from an owner, member or collaborator on a paused issue starts the same skill again. The default
# GitHub token is enough: board Status is moved by the Board sync workflow, not here.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to orchestrate
        required: true
      attempt:
        description: Run number after a usage-limit cut-off (set by the Resume job)
        required: false
        default: "1"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  # A feature is refined into work items, not implemented. The refine skill publishes the
  # cards as sub-issues and escalates open questions as a comment. It labels a card
  # `agent-ready` only when the project's `Card review` is `not required`; labels set with
  # the default token start no workflow, so this job dispatches a run per new labeled card.
  refine:
    name: Refine feature
    if: >-
      contains(github.event.issue.labels.*.name, 'feature')
      && (github.event.label.name == 'agent-ready'
          || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
              && contains(github.event.issue.labels.*.name, 'agent-paused')
              && github.event.comment.user.type != 'Bot'
              && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && (startsWith(github.event.comment.body, 'Resume') || startsWith(github.event.comment.body, '**Resume'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pause label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create agent-paused --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Run waiting for a human answer; comment starting with Resume to resume" || true
      - name: Note existing cards
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$FEATURE/sub_issues" --paginate --jq '.[].number' > "$RUNNER_TEMP/cards-before"
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          display_report: true
          prompt: /devflow:refine ${{ github.event.issue.number }}
          claude_args: |
            --max-turns 100
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Never end your turn with a status message: after a skill or subagent returns, continue with the next step. Stop only after the final report, or after pausing with a comment and the agent-paused label."
            --add-dir /home/runner/.claude/plugins/cache
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/card *),Edit,Write,Task,Skill"
      # The action hides the run's output, so a denial shows only as a count. List what was
      # denied, so the allow-list can be tuned from evidence.
      - name: List denied commands
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          set -o pipefail
          {
            echo "### Run result"
            jq -r '.[] | select(.type == "result") | "- subtype `\(.subtype)`, turns \(.num_turns)", (select(.is_error == true) | "- error result: \((.result // "(none)") | tostring | .[0:300])")' "$EXECUTION_FILE"
            echo "### Denied commands"
            jq -r '.[] | select(.type == "result") | .permission_denials[]? | "- `\(.tool_name)`: \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200])"' "$EXECUTION_FILE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start runs for new labeled cards
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$FEATURE/sub_issues" --paginate \
            --jq '.[] | select(any(.labels[]; .name == "agent-ready")) | .number' |
          while read -r card; do
            grep -qx "$card" "$RUNNER_TEMP/cards-before" && continue
            gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.event.repository.default_branch }}" -f issue="$card"
          done

  orchestrate:
    name: Orchestrate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (!contains(github.event.issue.labels.*.name, 'feature')
          && (github.event.label.name == 'agent-ready'
              || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
                  && contains(github.event.issue.labels.*.name, 'agent-paused')
                  && github.event.comment.user.type != 'Bot'
                  && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && (startsWith(github.event.comment.body, 'Resume') || startsWith(github.event.comment.body, '**Resume')))))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      limit_resets: ${{ steps.limit.outputs.resets }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pause label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create agent-paused --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Run waiting for a human answer; comment starting with Resume to resume" || true
      # Installs the pinned Rust toolchain and the gate's tools (just, nextest, ...).
      - name: Install toolchain
        run: |
          bash scripts/cloud-tools.sh --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Restore-only: the gate on dev writes this cache. The env matches the gate's so the
      # key does; it is set on this step alone to leave incremental builds on for the agent.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: 0
          RUST_BACKTRACE: 1
        with:
          shared-key: gate-ubuntu-latest
          save-if: false
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          # The run ends when the main agent stops, so a background subagent is killed
          # mid-task. Subagents must run in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action rejects a ref on plugin_marketplaces, so the plugin follows the
          # marketplace's default branch.
          plugin_marketplaces: https://github.com/WrackedFella/claude-skills.git
          plugins: devflow@claude-skills
          # Re-dispatched runs are started by the default token, so the actor is
          # github-actions[bot]. Allow only that bot; the repo is public.
          allowed_bots: github-actions
          display_report: true
          prompt: /devflow:orchestrate ${{ github.event.issue.number || inputs.issue }}
          # Allowed: what a run needs inside the checkout. `rm` removes one scratch file at a
          # time (a probe test); Bash paths outside the working directories are still denied.
          # Denied, and denials win over the allow-list: recursive rm, force pushes and
          # branch deletes (rulesets guard dev and main, not card branches), merging (only
          # pr-review.yml or a person merges).
          claude_args: |
            --max-turns 200
            --append-system-prompt "This is a headless run that ends when you stop. Run every subagent in the foreground and never end your turn while one is running. Never end your turn with a status message: after a skill or subagent returns, continue with the next step. Stop only after the final report, or after pausing with a comment and the agent-paused label."
            --add-dir /home/runner/.claude/plugins/cache /tmp
            --allowedTools "Bash(git:*),Bash(just:*),Bash(cargo:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Bash(gh run list:*),Bash(gh run view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(rg:*),Bash(grep:*),Bash(jq:*),Bash(mkdir:*),Bash(rm:*),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/board *),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/pr-facts *),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/intake-agree *),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/e2e-guard *),Bash(/home/runner/.claude/plugins/cache/claude-skills/devflow/*/scripts/test-guard *),Edit,Write,Task,SendMessage,Skill"
            --disallowedTools "Bash(rm -r:*),Bash(rm -R:*),Bash(rm -rf:*),Bash(rm -fr:*),Bash(rm -Rf:*),Bash(rm -fR:*),Bash(rm --recursive:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push --delete:*),Bash(git push -d:*),Bash(git push origin --force:*),Bash(git push origin -f:*),Bash(git push origin --force-with-lease:*),Bash(git push origin --delete:*),Bash(git push origin -d:*),Bash(git push -u origin --force:*),Bash(git push -u origin -f:*),Bash(gh pr merge:*)"
      # The action hides the run's output, so a denial shows only as a count. List what was
      # denied, so the allow-list can be tuned from evidence.
      - name: List denied commands
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          set -o pipefail
          {
            echo "### Run result"
            jq -r '.[] | select(.type == "result") | "- subtype `\(.subtype)`, turns \(.num_turns)"' "$EXECUTION_FILE"
            echo "### Denied commands"
            jq -r '.[] | select(.type == "result") | .permission_denials[]? | "- `\(.tool_name)`: \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200])"' "$EXECUTION_FILE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The subscription's usage limit ends a run mid-card. Its last result says when the limit
      # resets; the Resume job waits for that and starts the run again from the pushed branch.
      - name: Detect a usage-limit cut-off
        id: limit
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          resets=$(scripts/run-record.sh limit-reset "$EXECUTION_FILE" || true)
          [ -n "$resets" ] || exit 0
          echo "resets=$resets" >> "$GITHUB_OUTPUT"
          echo "### Usage limit" >> "$GITHUB_STEP_SUMMARY"
          echo "The run hit the usage limit, which resets at $resets UTC. The Resume job starts it again after the reset." >> "$GITHUB_STEP_SUMMARY"
      # One RUN-RECORD line per run, so real card runs build the per-step data that lane
      # decisions need (D0012). The execution log is not uploaded: the repository is public
      # and artifacts are not secret-masked.
      - name: Run record
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          # Never fail the run over its own bookkeeping.
          {
            gate=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.body // ""' |
              scripts/run-record.sh gate-class)
            record=$(GATE_CLASS="$gate" HEAD_SHA=$(git rev-parse HEAD) scripts/run-record.sh record "$EXECUTION_FILE")
            echo "RUN-RECORD $record"
            scripts/run-record.sh table <<<"$record" >> "$GITHUB_STEP_SUMMARY"
          } || echo "::warning::run record failed"
      # PRs opened with the default token start no workflow, so start the review loop here. A
      # PR the Claude app opened starts it through its own opened event; dispatching it too
      # would queue a duplicate.
      - name: Start PR review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate \
            --jq ".[] | select((.body // \"\") | test(\"Closes #$ISSUE([^0-9]|$)\")) | .number")
          for pr in $prs; do
            [ "${{ vars.PR_REVIEW_ENABLED }}" = true ] || continue
            [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .user.login)" = "claude[bot]" ] && continue
            gh workflow run pr-review.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.event.repository.default_branch }}" -f pr="$pr"
          done
          [ -n "$prs" ] && exit 0
          # A usage-limit cut-off is picked up by the Resume job.
          if [ -n "${{ steps.limit.outputs.resets }}" ]; then
            echo "::warning::Orchestrate #$ISSUE hit the usage limit; Resume restarts it"
            exit 0
          fi
          # No PR is fine only when the run paused for an answer.
          if gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' |
            grep -qx agent-paused; then
            exit 0
          fi
          msg="Orchestrate #$ISSUE ended with no open PR and no agent-paused label"
          echo "::error::$msg"
          echo "### Outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg. Resume with: gh workflow run claude.yml --ref dev -f issue=$ISSUE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # A run the usage limit cut off starts again once it resets. The job sleeps on the runner
  # (minutes are free on a public repository) and gives up after three runs. The new run
  # queues behind this one in the issue's concurrency group, and continues from the pushed
  # branch like any manual Resume.
  resume:
    name: Resume after usage limit
    needs: orchestrate
    if: always() && needs.orchestrate.outputs.limit_resets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ATTEMPT: ${{ inputs.attempt }}
      RESETS: ${{ needs.orchestrate.outputs.limit_resets }}
    steps:
      - name: Dispatch the run after the reset
        run: |
          [[ $ATTEMPT =~ ^[0-9]+$ ]] || ATTEMPT=1
          if [ "$ATTEMPT" -ge 3 ]; then echo "::warning::#$ISSUE still limited after $ATTEMPT runs"; exit 0; fi
          # "3:50am": the next such time, plus a 5-minute margin.
          target=$(date -u -d "$RESETS" +%s 2>/dev/null || date -u -d "+5 hours" +%s)
          now=$(date -u +%s)
          [ "$target" -le "$now" ] && target=$((target + 86400))
          wait=$((target - now + 300))
          [ "$wait" -gt 18900 ] && wait=18900
          echo "Waiting $((wait / 60)) minutes for the limit to reset, then running #$ISSUE again"
          sleep "$wait"
          gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" -f issue="$ISSUE" -f attempt="$((ATTEMPT + 1))"
