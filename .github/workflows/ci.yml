name: CI

on:
  push:
    branches: [ main, dev, shader-work, time-of-day ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

# This CI workflow runs independently of the metrics workflow.
# Both workflows trigger on the same events but execute in parallel.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # Disable incremental compilation for CI
  RUST_BACKTRACE: 1

jobs:
  # Single job that does everything - eliminates job overhead
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      # Install system dependencies
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libssl-dev
      
      # Use Swatinem's cache action - much faster than manual caching
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          cache-on-failure: true
          # Cache all target directories including dependencies
          cache-targets: true
          # Save cache even if build fails
          save-if: true
      
      # Check formatting first (fast, fails early)
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      # Run clippy (catches issues before full build)
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      # Build all targets (leverages cache from clippy)
      - name: Build
        run: cargo build --all-targets --all-features
      
      # Run tests
      - name: Run tests
        run: cargo test --workspace --all-features -- --nocapture
      
      # Run UI tests separately (only if other tests pass)
      - name: Run UI tests
        run: cargo test -p moho_ui --features 'ui-egui ui-egui-test'
        continue-on-error: true  # UI tests can be flaky

  # Optional: Separate benchmark job (only on Linux, only on push to main/dev)
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      
      - name: Run benchmarks
        run: cargo bench --bench event_bus_bench -- --output-format bencher

