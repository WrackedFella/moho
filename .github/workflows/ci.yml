name: CI

on:
  push:
    branches: [ main, dev, shader-work ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install system deps (alsa, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      # --- Caching and sccache setup (speeds up Rust builds) ---
      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-

      - name: Install sccache
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache || true
        # Note: on macOS use `brew install sccache`, on Windows use choco/scoop

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure sccache wrapper
        run: |
          echo "RUSTC_WRAPPER=$(which sccache)" >> $GITHUB_ENV
          # Start sccache server and set a sensible cache size
          sccache --stop-server || true
          sccache --start-server || true
          sccache --set-cache-size 10G || true

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --all --workspace -- -q
      - name: Run moho_ui tests with egui feature
        run: cargo test -p moho_ui --features 'ui-egui ui-egui-test' -- -q
