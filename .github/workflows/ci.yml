name: CI

on:
  push:
    branches: [ main, dev, shader-work ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install system deps (alsa, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --all --workspace -- -q
      - name: Run moho_ui tests with egui feature
        run: cargo test -p moho_ui --features 'ui-egui ui-egui-test' -- -q
