name: Chain

# Starts queued work items. A work item labelled `agent-queued` is approved and waits for
# every item blocking it (`blocked by`) to close; this workflow starts each one that has
# none open, up to AGENT_MAX_RUNS unattended runs at a time (default 1). An item whose
# board header says `eligible=no` is never started: the chain stops there, and continues
# when a person's PR for it merges and closes it. No model call; scripts/chain.sh decides.
#
# Events: an issue closing (the usual next step), the queue label being added (starting a
# chain), a Claude run finishing (a run slot frees up), a schedule as a backstop for a
# missed event, and by hand.
on:
  issues:
    types: [closed, labeled]
  workflow_run:
    workflows: [Claude]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

# One decision at a time, so two events can't start the same item twice. A newer pending
# run replaces an older one; each reads the current state.
concurrency:
  group: chain
  cancel-in-progress: false

jobs:
  advance:
    name: Advance
    if: >-
      github.event_name != 'issues'
      || github.event.action == 'closed'
      || github.event.label.name == 'agent-queued'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AGENT_MAX_RUNS: ${{ vars.AGENT_MAX_RUNS }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure queue label
        run: gh label create agent-queued --color 0E8A16 --description "Approved; starts unattended once every blocking issue is closed" || true
      - name: Decide
        run: |
          scripts/chain.sh gather > "$RUNNER_TEMP/chain-facts.json"
          scripts/chain.sh decide "$RUNNER_TEMP/chain-facts.json" > "$RUNNER_TEMP/chain.tsv"
          {
            echo "### Chain"
            echo
            [ -s "$RUNNER_TEMP/chain.tsv" ] || echo "No queued work items."
            awk -F'\t' '{ printf "- %s #%s: %s\n", $1, $2, ($1 == "comment" ? $3 : $4) }' "$RUNNER_TEMP/chain.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      # A label added with the default token starts no workflow, so the run is dispatched;
      # the label shows the item is running and keeps the next decision from starting it again.
      - name: Start and report
        run: |
          footer=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          base=$(gh api "repos/$GH_REPO" --jq .default_branch)
          while IFS=$'\t' read -r action issue key text; do
            case $action in
              start)
                gh issue edit "$issue" --remove-label agent-queued --add-label agent-ready
                gh workflow run claude.yml --ref "$base" -f issue="$issue"
                gh issue comment "$issue" --body "Started by the chain: no item blocking it is open. Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID$footer"
                ;;
              comment)
                gh issue comment "$issue" --body "$text <!-- chain: $key -->$footer"
                ;;
            esac
          done < "$RUNNER_TEMP/chain.tsv"
