# Standalone metrics workflow using mozilla/rust-code-analysis CLI
# Produces per-file JSON metrics and a small aggregated summary, uploads as artifact.
#
# Triggers: push and pull_request by default. Adjust as needed.
name: "Metrics — rust-code-analysis"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: write

env:
  METRICS_OUTPUT_DIR: metrics-output
  METRICS_SUMMARY_DIR: metrics-summary
  MAX_FUNCTION_CYCLOMATIC: '20'    # adjust threshold as needed
  MIN_MI_VISUAL_STUDIO: '65'       # adjust threshold as needed

jobs:
  gather-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev clang || true

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build rust-code-analysis-cli
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          git clone --depth 1 https://github.com/mozilla/rust-code-analysis.git "$TMPDIR"
          cd "$TMPDIR/rust-code-analysis-cli"
          cargo build --release
          cp target/release/rust-code-analysis-cli "$GITHUB_WORKSPACE/"

      - name: Run metrics (produce JSON per-file)
        run: |
          set -euo pipefail
          rm -rf "$METRICS_OUTPUT_DIR" "$METRICS_SUMMARY_DIR"
          mkdir -p "$METRICS_OUTPUT_DIR" "$METRICS_SUMMARY_DIR"
          ./rust-code-analysis-cli -m -p . -O json -o "$METRICS_OUTPUT_DIR" --pr

      - name: Aggregate metrics (simple summaries)
        run: |
          set -euo pipefail
          # Combine per-file JSONs into one array
          python - <<'PY' > "$METRICS_SUMMARY_DIR/all_metrics.json"
import json,glob,os,sys
out=[]
for p in glob.glob("metrics-output/*.json"):
    try:
        with open(p,'r',encoding='utf-8') as f:
            j=json.load(f)
            j.setdefault("__src_file", os.path.basename(p))
            out.append(j)
    except Exception as e:
        print("skipping",p,"err",e,file=sys.stderr)
print(json.dumps(out))
PY

          # Extract functions with cyclomatic complexity > MAX_FUNCTION_CYCLOMATIC
          python - <<'PY' > "$METRICS_SUMMARY_DIR/high_cc_functions.json"
import json,glob,os
th = int(os.environ.get("MAX_FUNCTION_CYCLOMATIC","20"))
res=[]
for p in glob.glob("metrics-output/*.json"):
  try:
    j=json.load(open(p,'r',encoding='utf-8'))
    path = j.get("path") or j.get("__src_file") or p
    for f in j.get("functions", []) or []:
      cc = f.get("cyclomatic") or f.get("cyclomatic_complexity") or None
      if cc is None: continue
      try:
        if float(cc) > th:
          res.append({"file": path, "function": f.get("name"), "cyclomatic": cc, "start_line": f.get("start_line")})
      except:
        pass
  except Exception:
    pass
print(json.dumps(res))
PY

          # Extract per-file maintainability index (visual studio variant)
          python - <<'PY' > "$METRICS_SUMMARY_DIR/mi_per_file.json"
import json,glob
out=[]
for p in glob.glob("metrics-output/*.json"):
  try:
    j=json.load(open(p,'r',encoding='utf-8'))
    mi = None
    for key in ["maintainability_index","mi","mi_stats"]:
      if key in j and isinstance(j[key], dict) and "mi_visual_studio" in j[key]:
        mi = j[key]["mi_visual_studio"]
        break
    if mi is None:
      mi = j.get("mi_visual_studio") or j.get("mi")
    out.append({"file": j.get("path") or j.get("__src_file") or p, "mi_visual_studio": mi})
  except Exception:
    pass
print(json.dumps(out))
PY

      - name: Optionally fail on policy thresholds (disabled by default)
        run: |
          set -euo pipefail
          echo "High cyclomatic complexity check (threshold: $MAX_FUNCTION_CYCLOMATIC)"
          if [ -s "$METRICS_SUMMARY_DIR/high_cc_functions.json" ]; then
            echo "High cyclomatic functions found:"
            jq '.' "$METRICS_SUMMARY_DIR/high_cc_functions.json" || true
            echo "To fail the job on high CC, uncomment exit 1 in the workflow step."
          else
            echo "No functions above threshold."
          fi

          echo "Checking MI below minimum ($MIN_MI_VISUAL_STUDIO)..."
          python - <<'PY'
import json,sys
mi_min = float(sys.argv[1])
arr = json.load(open("metrics-summary/mi_per_file.json"))
low = [x for x in arr if x.get("mi_visual_studio") is not None and float(x.get("mi_visual_studio")) < mi_min]
print(len(low))
PY "$MIN_MI_VISUAL_STUDIO" | grep -q -x '0' && echo "No low MI files." || (echo "Some files with MI below threshold" && jq '.[] | select(.mi_visual_studio != null and (.mi_visual_studio | tonumber) < '"$MIN_MI_VISUAL_STUDIO"')' "$METRICS_SUMMARY_DIR/mi_per_file.json" || true)

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: |
            ${{ env.METRICS_OUTPUT_DIR }}
            ${{ env.METRICS_SUMMARY_DIR }}