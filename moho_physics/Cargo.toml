[package]
name = "moho_physics"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rapier3d = { workspace = true }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
thiserror = { workspace = true }
moho_core = { path = "../moho_core" }
moho_render_api = { path = "../moho_render_api" }

[features]
# Engine-typed setup and readback helpers for tests outside this crate (ADR-0038); enable
# from `[dev-dependencies]` only.
test-support = []

[dev-dependencies]
moho_physics = { path = ".", features = ["test-support"] }
postcard = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
